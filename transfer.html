<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPAA Alliance - Transfer Surge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #090d16, #110f24, #05070f);
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      animation: fadePage 0.5s ease;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.35;
      pointer-events: none;
    }
    body::before { background: #6366f1; top: -100px; left: -100px; }
    body::after { background: #3b82f6; bottom: -100px; right: -100px; }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0; 
      box-sizing: border-box;
    }

    nav {
      width: 95%; 
      max-width: 1200px; 
      margin: 20px auto; 
      padding: 15px 25px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 20px;       
      z-index: 1000;
      box-sizing: border-box;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .nav-links a:hover { color: #60a5fa; }

    .top-header {
      text-align: center;
      margin-bottom: 35px;
      padding: 28px 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06); 
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
      box-sizing: border-box;
    }

    .top-header:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 50px rgba(59, 130, 246, 0.25), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    
    .top-header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(96, 165, 250, 0.18), transparent 60%);
      pointer-events: none;
    }
    
    .top-header::after {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      pointer-events: none;
    }
    
    .top-header h1 {
      text-align: center;
      margin: 0;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 28px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(96, 165, 250, 0.25);
    }
    .subtitle {
      color: #94a3b8;
      margin-top: 12px;
      margin-bottom: 0;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      display: inline-block;
      border-radius: 50%;
      background: #10b981;
      margin-right: 10px;
      box-shadow: 0 0 12px #10b981;
    }

    .form-panel, .list-panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 24px;
      backdrop-filter: blur(16px);
      margin-bottom: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .panel-title {
      margin-top: 0;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .input-grid {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, select {
      background: rgba(15, 23, 42, 0.6);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
      border-radius: 16px;
      flex: 1;
      min-width: 200px;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    input:focus, select:focus {
      border-color: #6366f1;
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
    }

    button {
      transition: all 0.25s ease;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 1.5px;
      padding: 14px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    button:active { transform: scale(0.98); }
    .submit-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; width: 100%; }
    .clear-btn { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; margin-bottom: 25px; width: 100%; }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.1);
      display: inline-block;
    }
    .seat-gold { background: rgba(234, 179, 8, 0.2); color: #fde047; border-color: #eab308; }
    .seat-purple { background: rgba(168, 85, 247, 0.2); color: #f3e8ff; border-color: #a855f7; }
    .seat-blue { background: rgba(59, 130, 246, 0.2); color: #dbeafe; border-color: #3b82f6; }
    .seat-white { background: rgba(255, 255, 255, 0.15); color: #ffffff; border-color: #ffffff; }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
    th { padding: 14px; color: #60a5fa; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid rgba(255,255,255,0.08); }
    td { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #e2e8f0; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .rank-col { font-weight: 800; color: #60a5fa; width: 50px; }
    .action-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 6px 12px; border-radius: 8px; font-size: 10px; }
    .action-btn:hover { background: rgba(239, 68, 68, 0.25); transform: scale(1.05); }

    .empty-msg { opacity: 0.4; font-style: italic; text-align: center; padding: 25px; color: #94a3b8; font-size: 13px; }

    /* Alliance Watermark Styling */
    .alliance-footer {
      margin-top: 50px;
      margin-bottom: 30px;
      text-align: center;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ef4444, #60a5fa, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    .alliance-footer:hover {
      opacity: 1;
      transform: scale(1.02);
      text-shadow: 0 0 25px rgba(96, 165, 250, 0.4);
    }

    @media (max-width: 900px) {
      .input-grid { flex-direction: column; }
      input, select, button { width: 100%; }
    }

    @keyframes fadePage { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.3); }

    @media (max-width: 600px) {
      nav { padding: 10px 12px; margin: 10px auto; width: 95%; border-radius: 12px; gap: 5px; }
      .logo { font-size: 13px; letter-spacing: 0.5px; white-space: nowrap; }
      .nav-links { display: flex; gap: 8px; }
      .nav-links a { margin-left: 0; font-size: 9px; padding: 5px 8px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">OPAA ALLIANCE</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="generator.html">Team Maker</a>
        <a href="buff.html">Buffs</a>
    </div>
  </nav>

  <div class="container">
    <div class="top-header">
      <h1>1341 Transfer Registry</h1>
      <p class="subtitle">
        <span class="live-dot"></span>
        Player Migration Registry For 1341
      </p>
    </div>

    <!-- Registration Form Panel -->
    <div class="form-panel">
      <div class="panel-title">Register Incoming Player</div>
      <div class="input-grid">
        <input type="text" id="playerName" placeholder="Player Name" required />
        <input type="number" id="playerServer" placeholder="Origin Server (e.g. 1317)" required />
        <input type="number" step="0.1" id="playerThp" placeholder="Total Hero Power (THP)" required />
        <select id="playerSeat">
          <option value="gold">Gold Seat</option>
          <option value="purple">Purple Seat</option>
          <option value="blue">Blue Seat</option>
          <option value="white">White Seat</option>
        </select>
      </div>
      <button class="submit-btn" onclick="registerPlayer()">Submit Registration</button>
    </div>

    <!-- Admin controls hidden by default -->
    <button id="clearAllBtn" class="clear-btn" onclick="clearRegistry()" style="display:none;">Clear Entire Registry</button>

    <!-- Sorted Lineup Table Panel -->
    <div class="list-panel">
      <div class="panel-title">Current Sorted Player (Ranked by THP)</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="rank-col">Rank</th>
              <th>Name</th>
              <th>From Server</th>
              <th>Total Hero Power (THP)</th>
              <th>Seat Status</th>
              <th id="actionHeader" style="display:none;">Action</th>
            </tr>
          </thead>
          <tbody id="lineupTableBody">
            <!-- Loaded dynamically via Firestore -->
          </tbody>
        </table>
        <div id="emptyMessage" class="empty-msg">No registrations found.</div>
      </div>
    </div>

    <!-- Alliance Watermark Footer -->
    <div class="alliance-footer">☠ 666 • OPAA ALLIANCE • SERVER 1341 ☠</div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      getDocs,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7FLnKz0hq1fBIZT9UakE7h8K-IWCkHws",
      authDomain: "opaa-team-generator.firebaseapp.com",
      projectId: "opaa-team-generator",
      storageBucket: "opaa-team-generator.firebasestorage.app",
      messagingSenderId: "512103695316",
      appId: "1:512103695316:web:76df61edd28072780fcc41"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let registeredPlayers = [];
    const isAdmin = window.location.search.includes("admin=opaa1341");

    // Core registration logic wrapped safely
    async function registerPlayer() {
      const name = document.getElementById("playerName").value.trim();
      const server = document.getElementById("playerServer").value.trim();
      const thp = parseFloat(document.getElementById("playerThp").value);
      const seat = document.getElementById("playerSeat").value;

      if (!name || !server || isNaN(thp)) {
        alert("Please complete all form options correctly!");
        return;
      }

      // NEW: Check if the player name already exists in the registry
      const nameExists = registeredPlayers.some(
        (player) => player.name.toLowerCase() === name.toLowerCase()
      );
      if (nameExists) {
        alert(`Error: A player named "${name}" is already registered!`);
        return;
      }

      try {
        await addDoc(collection(db, "transferSurge"), {
          name: name,
          server: server,
          thp: thp,
          seat: seat,
          timestamp: Date.now()
        });

        document.getElementById("playerName").value = "";
        document.getElementById("playerServer").value = "";
        document.getElementById("playerThp").value = "";
        alert("Successfully registered!");
      } catch (error) {
        console.error("Error submitting documentation: ", error);
        alert("Firebase error: " + error.message);
      }
    }

    async function deletePlayer(id) {
      if(confirm("Delete this registry entry?")) {
        try {
          await deleteDoc(doc(db, "transferSurge", id));
        } catch(err) {
          console.error(err);
        }
      }
    }

    async function clearRegistry() {
      if(!confirm("Are you absolutely sure you want to clear the entire list?")) return;
      try {
        const snapshot = await getDocs(collection(db, "transferSurge"));
        for (const documentSnap of snapshot.docs) {
          await deleteDoc(doc(db, "transferSurge", documentSnap.id));
        }
      } catch(err) {
        console.error(err);
      }
    }

    function renderTable() {
      const tbody = document.getElementById("lineupTableBody");
      const emptyMsg = document.getElementById("emptyMessage");

      if (registeredPlayers.length === 0) {
        tbody.innerHTML = "";
        emptyMsg.style.display = "block";
        return;
      }

      emptyMsg.style.display = "none";
      tbody.innerHTML = "";

      registeredPlayers.forEach((player, index) => {
        tbody.innerHTML += `
          <tr>
            <td class="rank-col">#${index + 1}</td>
            <td><strong>${player.name}</strong></td>
            <td>S${player.server}</td>
            <td>${Number(player.thp).toFixed(1)}</td>
            <td><span class="badge seat-${player.seat}">${player.seat}</span></td>
            ${isAdmin ? `<td><button class="action-btn" onclick="deletePlayer('${player.id}')">Remove</button></td>` : ""}
          </tr>
        `;
      });
    }

    // MAP TO WINDOW IMMEDIATELY: Ensures HTML can click them right away
    window.registerPlayer = registerPlayer;
    window.deletePlayer = deletePlayer;
    window.clearRegistry = clearRegistry;

    // Initialize layout options
    if (isAdmin) {
      document.getElementById("clearAllBtn").style.display = "block";
      document.getElementById("actionHeader").style.display = "table-cell";
    }

    // Real-time listener setup with added failure catch block
    try {
      onSnapshot(collection(db, "transferSurge"), (snapshot) => {
        registeredPlayers = [];
        snapshot.forEach((docSnap) => {
          registeredPlayers.push({ id: docSnap.id, ...docSnap.data() });
        });

        // Sort by Total Hero Power (THP) highest to lowest
        registeredPlayers.sort((a, b) => b.thp - a.thp);
        renderTable();
      }, (error) => {
        console.error("Firestore real-time error: ", error);
      });
    } catch(e) {
      console.error("Initialization error structural hook: ", e);
    }
  </script>
</body>
</html>
